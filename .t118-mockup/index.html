<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проверка мешей · макет T-118</title>
<!-- Макет T-20261112-118 (шаг 1). Статичный: данные — 8 настоящих карточек /lab/mesh-audit (DEV current_items, 12.11),
     отметки и комментарии — для примера. Состояние для снимков — из адреса: ?tab=kashpo&zoom=photo:0 -->
<style>
  :root {
    --bg: rgb(251 248 243); --bg2: rgb(243 238 231); --card: #fff;
    --line: rgb(231 229 228); --line2: rgb(214 211 209);
    --text: rgb(41 37 36); --text2: rgb(87 83 78); --text3: rgb(120 113 108);
    --brand: rgb(176 106 74); --brand50: rgb(250 243 239);
    --ok: #079455; --ok50: #ecfdf3; --ok200: #abefc6;
    --bad: #d92d20; --bad50: #fef3f2; --bad200: #fecdca;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1152px; margin: 0 auto; padding: 16px 16px 40px; }

  /* шапка */
  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; }
  .total { color: var(--text3); font-size: 13px; }
  .bar { height: 4px; border-radius: 2px; background: var(--line); margin: 8px 0 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--brand); }

  /* разделы — ряд «таблеток», на телефоне прокручивается вбок */
  .tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: 0 -16px; padding: 8px 16px;
    display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line); }
  @media (min-width: 900px) { .tabs { flex-wrap: wrap; overflow: visible; } } /* на компьютере все разделы видны сразу */
  .tabs::-webkit-scrollbar { display: none; }
  .tab { flex: none; display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 10px; border-radius: 999px;
    border: 1px solid var(--line2); background: var(--card); color: var(--text2); font-size: 13px; cursor: pointer; white-space: nowrap; }
  .tab b { font-weight: 600; color: var(--text); }
  .tab small { font-size: 12px; color: var(--text3); }
  .tab.on { background: var(--text); border-color: var(--text); }
  .tab.on b, .tab.on small { color: #fff; }
  .tab.done small { color: var(--ok); }

  /* заголовок раздела */
  .sec { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0 10px; }
  .sec h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .sec h2 span { font-weight: 400; color: var(--text3); font-size: 14px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line2);
    background: var(--card); color: var(--text2); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; }
  .btn.brand { background: var(--brand); border-color: var(--brand); color: #fff; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: none; padding: 7px 10px; font: inherit; font-size: 13px; color: var(--text2); cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line2); }
  .seg button.on { background: var(--bg2); color: var(--text); font-weight: 600; }

  /* карточки: на компьютере 2 в ряд, внутри фото | модель */
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .card.ok { border-color: var(--ok200); }
  .card.bad { border-color: var(--bad200); }
  .pics { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 560px) { .pics { grid-template-columns: 1fr 1fr; } }
  .pic { position: relative; aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: rgb(244 244 242); border: 0; padding: 0; cursor: zoom-in; }
  @media (min-width: 560px) { .pic { aspect-ratio: 1 / 1; } }
  .pic.photo { background: #fff; outline: 1px solid var(--line); outline-offset: -1px; }
  .pic img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .pic .lbl { position: absolute; left: 6px; top: 6px; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 600;
    background: rgba(255,255,255,.92); color: var(--text2); box-shadow: 0 0 0 1px var(--line); }
  .pic .zoom { position: absolute; right: 6px; bottom: 6px; width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center;
    background: rgba(255,255,255,.92); box-shadow: 0 0 0 1px var(--line); }
  .meta { display: flex; flex-direction: column; gap: 2px; }
  .name { font-weight: 600; font-size: 14px; color: var(--text); }
  .sub { font-size: 12px; color: var(--text3); }
  .row { display: flex; gap: 8px; }
  .v { flex: 1; display: inline-flex; justify-content: center; align-items: center; gap: 6px; padding: 10px 0; border-radius: 8px;
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--line2); background: var(--card); color: var(--text2); }
  .v.ok.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .v.bad.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .note { position: relative; }
  .note textarea { width: 100%; min-height: 40px; resize: none; overflow: hidden; border: 1px solid var(--line2); border-radius: 8px; padding: 9px 10px 18px;
    font: inherit; font-size: 14px; color: var(--text); background: var(--card); }
  .note textarea:focus { outline: 2px solid var(--brand50); border-color: var(--brand); }
  .saved { position: absolute; right: 8px; bottom: 6px; font-size: 11px; color: var(--text3); }
  .saved.ok { color: var(--ok); }
  .state { font-size: 12px; color: var(--text3); }
  .state.bad { color: var(--bad); }
  .more { margin: 16px 0 0; display: flex; justify-content: center; gap: 8px; }

  /* увеличение на весь экран */
  .zoomer { position: fixed; inset: 0; z-index: 50; background: rgb(18 16 15); display: none; flex-direction: column; }
  .zoomer.open { display: flex; }
  .zhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; color: #e7e5e4; font-size: 13px; }
  .zhead .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { flex: none; width: 40px; height: 40px; border-radius: 10px; border: 0; background: rgba(255,255,255,.12); color: #fff; font-size: 22px; cursor: pointer; }
  .zbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr; gap: 8px; padding: 0 8px; }
  .zbody figure { margin: 0; min-height: 0; position: relative; display: none; border-radius: 10px; overflow: hidden; }
  .zbody figure.on { display: block; }
  .zbody figure.photo { background: #fff; }
  .zbody figure.model { background: rgb(244 244 242); }
  .zbody img { width: 100%; height: 100%; object-fit: contain; }
  .zbody figcaption { position: absolute; left: 8px; top: 8px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 600;
    background: rgba(255,255,255,.92); color: var(--text2); }
  @media (min-width: 900px) { .zbody { grid-template-columns: 1fr 1fr; } .zbody figure { display: block; } }
  .zfoot { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 14px; }
  .zfoot .seg { align-self: center; background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.25); }
  .zfoot .seg button { color: #d6d3d1; padding: 8px 18px; }
  .zfoot .seg button + button { border-left-color: rgba(255,255,255,.25); }
  .zfoot .seg button.on { background: #fff; color: var(--text); }
  @media (min-width: 900px) { .zfoot .seg { display: none; } }
  .zfoot .row { max-width: 520px; width: 100%; align-self: center; }
  .zfoot .v { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.25); color: #e7e5e4; }
  .zfoot .v.ok.on { background: var(--ok); border-color: var(--ok); color: #fff; }
  .zfoot .v.bad.on { background: var(--bad); border-color: var(--bad); color: #fff; }
  .hint { text-align: center; font-size: 11px; color: #a8a29e; }
  .hint.pc { display: none; }
  @media (min-width: 900px) { .hint.ph { display: none; } .hint.pc { display: block; } }
  .mock { font-size: 11px; color: var(--text3); margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Проверка мешей</h1>
    <span class="total" id="total"></span>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="sec">
    <h2 id="sech"></h2>
    <div class="actions">
      <div class="seg" id="filter"><button class="on">все</button><button>непроверенные</button><button>брак</button></div>
      <button class="btn brand" id="cont">К непроверенным ↓</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="more"><button class="btn">Ещё 20</button><button class="btn" id="next"></button></div>
  <p class="mock">макет · отметки и комментарии для примера</p>
</main>

<div class="zoomer" id="zoomer" role="dialog" aria-modal="true">
  <div class="zhead"><span class="t" id="zt"></span><button class="x" id="zx" aria-label="Закрыть">×</button></div>
  <div class="zbody">
    <figure class="photo" id="zfp"><img id="zip" alt="фото товара"><figcaption>фото</figcaption></figure>
    <figure class="model" id="zfm"><img id="zim" alt="модель"><figcaption>модель</figcaption></figure>
  </div>
  <div class="zfoot">
    <div class="seg" id="zseg"><button data-z="photo">фото</button><button data-z="model">модель</button></div>
    <div class="row" id="zv"></div>
    <div class="hint ph">щипком увеличить · смахнуть вбок: фото / модель</div>
    <div class="hint pc">колёсиком увеличить · Esc закрыть · ← → соседняя карточка</div>
  </div>
</div>

<script>
const P = 'https://remont-lab.online/test/mesh-audit/posters/';
// 13 разделов из ролей каталога (реальные числа карточек на DEV 12.11: current_items(), всего 2765)
const SECTIONS = [
  ['divan', 'Диваны', 451, 2], ['kreslo', 'Кресла', 233, 0], ['stul', 'Стулья', 257, 0], ['stolik', 'Журнальные столики', 178, 0],
  ['stol', 'Обеденные столы', 168, 0], ['tv', 'Тумбы ТВ', 95, 0], ['komod', 'Комоды', 163, 0], ['shkaf', 'Шкафы, стеллажи, витрины', 172, 0],
  ['puf', 'Пуфы', 140, 0], ['kashpo', 'Кашпо', 200, 1], ['vaza', 'Вазы', 46, 46], ['svet', 'Свет', 272, 0], ['kamin', 'Камины', 86, 0],
  ['prochee', 'Без типа', 304, 0],
];
const ITEMS = {
  divan: [
    { name: 'Диван прямой divan.ru Риббл-1 Букле Молочный', sku: '112923:10111726372869571729', var: '+5 вариантов',
      photo: 'https://cdn0.divan.ru/img/v1/oJDtYYU4Vj5FgodivW9SAFrSLlcLL6VEGcs30oz0d1A/rs:fit:800:600:1:1:ce:0:0/g:ce:0:0/bg:ffffff/q:85/czM6Ly9kaXZhbi9wcm9kdWN0LzQ5OTI3NTcucG5n.jpg',
      poster: P + '112923-10111726372869571729_f3121e647904d516_v1_1_ae17013a.jpg', hd: 'img/hd-112923-10111726372869571729_f3121e647904d516_v1_1_ae17013a.jpg',
      v: 'ok', note: '', saved: '' },
    { name: 'Диван Бостон Мини Рогожка Мальмо синий', sku: '114667:5141803459675920362', var: '',
      photo: 'https://mnogomebeli.com/upload/iblock/9b3/zz5xo1e3siwxwl8nthiee1807946suoi/Frame-5978.jpg',
      poster: P + '114667-5141803459675920362_243e375e19df8dda_v1_1_e9efec4a.jpg',
      v: 'bad', note: 'подлокотники ниже, чем на фото; цвет темнее', saved: 'ok', state: 'брак · уйдёт на переделку 1 из 2' },
    { name: 'Угловой диван Ванкувер велюр Монолит мокко', sku: '114667:7701300897294268317', var: '+6 вариантов',
      photo: 'https://mnogomebeli.com/upload/iblock/d0e/1xofgxgcewbpeo6y2idsudrbwgf3kr0e/Frame-6828.jpg',
      poster: P + '114667-7701300897294268317_d6bf768cfece9ecf_v1_1_97807f08.jpg',
      v: '', note: 'угол не с той стороны?', saved: 'saving' },
    { name: 'Диван прямой divan.ru Хевит Велюр Серо-голубой', sku: '112923:11230353943957833552', var: '',
      photo: 'https://cdn0.divan.ru/img/v1/lH8H4Q2LJEva9kZZDVQLX6pHAsClnlpI22S8uLW0fhU/rs:fit:800:600:1:1:ce:0:0/g:ce:0:0/bg:ffffff/q:85/czM6Ly9kaXZhbi9wcm9kdWN0LzUxMDAxMTAucG5n.jpg',
      poster: P + '112923-11230353943957833552_e63c6496b2e0b1e6_v1_1_5dc4f03f.jpg', v: '', note: '', saved: '' },
  ],
  kashpo: [
    { name: 'Кашпо квадратное Prosperplast Oro 29х29 h45 см зеленый с вкладышем', sku: '99272:1380905324458342313', var: '+2 варианта',
      photo: 'https://tvoydom.ru/photos/100/285/1002853625/1002853625_1.jpg',
      poster: P + '99272-1380905324458342313_cf716dd997954fad_v1_1_835bc72c.jpg', hd: 'img/hd-99272-1380905324458342313_cf716dd997954fad_v1_1_835bc72c.jpg',
      v: 'ok', note: 'хорошо', saved: 'ok' },
    { name: 'Кашпо на ножках Glasar 28х28х45 см', sku: '99272:10526598566543336690', var: '',
      photo: 'https://tvoydom.ru/photos/100/269/1002699923/1002699923_1.jpg',
      poster: P + '99272-10526598566543336690_59d63b1ee5824465_v1_1_f76ccc16.jpg', v: '', note: '', saved: '' },
    { name: 'Кашпо для цветов Hinwell 31х27 см зеленое', sku: '99272:9291635762585897906', var: '',
      photo: 'https://tvoydom.ru/photos/100/281/1002814518/2450010445632_105.jpg',
      poster: P + '99272-9291635762585897906_042088bdf91a733c_v1_1_281566f4.jpg', v: '', note: '', saved: '' },
    { name: 'Кашпо Urbi round серое 30х29 см', sku: '99272:6146555385599546030', var: '',
      photo: 'https://tvoydom.ru/photos/100/264/1002643978/1002643978_01.jpg',
      poster: P + '99272-6146555385599546030_351713d30d6e8ada_v1_1_b8489775.jpg', v: '', note: '', saved: '' },
  ],
};
const q = new URLSearchParams(location.search);
const tab = q.get('tab') || 'divan';
const zoomQ = q.get('zoom'); // photo:0 | model:0
const LOUPE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#57534e" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M11 8v6M8 11h6"/></svg>';

const all = SECTIONS.reduce((s, x) => s + x[2], 0), doneAll = SECTIONS.reduce((s, x) => s + x[3], 0);
document.getElementById('total').textContent = `проверено ${doneAll} из ${all}`;
document.getElementById('bar').style.width = Math.max(0.6, 100 * doneAll / all) + '%';
document.getElementById('tabs').innerHTML = SECTIONS.map(([k, t, n, d]) =>
  `<button class="tab${k === tab ? ' on' : ''}${d === n ? ' done' : ''}"><b>${t}</b><small>${d === n ? '✓ ' + n : d + ' / ' + n}</small></button>`).join('');
const sec = SECTIONS.find((s) => s[0] === tab), idx = SECTIONS.indexOf(sec);
document.getElementById('sech').innerHTML = `${sec[1]} <span>· проверено ${sec[3]} из ${sec[2]}</span>`;
document.getElementById('next').textContent = `Дальше: ${SECTIONS[idx + 1][1]} →`;

const vbtn = (v) => `<button class="v ok${v === 'ok' ? ' on' : ''}">✓ Ок</button><button class="v bad${v === 'bad' ? ' on' : ''}">✕ Брак</button>`;
const savedTxt = { ok: '<span class="saved ok">сохранено ✓</span>', saving: '<span class="saved">сохраняю…</span>', '': '' };
document.getElementById('grid').innerHTML = (ITEMS[tab] || []).map((it, i) => `
  <section class="card ${it.v}">
    <div class="pics">
      <button class="pic photo" data-i="${i}" data-z="photo"><img src="${it.photo}" alt="фото товара" loading="lazy"><span class="lbl">фото</span><span class="zoom">${LOUPE}</span></button>
      <button class="pic" data-i="${i}" data-z="model"><img src="${it.poster}" alt="модель" loading="lazy"><span class="lbl">модель</span><span class="zoom">${LOUPE}</span></button>
    </div>
    <div class="meta"><span class="name">${it.name}</span><span class="sub">${it.sku}${it.var ? ' · ' + it.var : ''}</span></div>
    <div class="row">${vbtn(it.v)}</div>
    <div class="note"><textarea rows="1" placeholder="Комментарий, необязательно">${it.note}</textarea>${savedTxt[it.saved]}</div>
    ${it.state ? `<span class="state bad">${it.state}</span>` : ''}
  </section>`).join('');

// поле комментария растёт по тексту (без ручки размера: она наезжала на «сохранено»)
const grow = (t) => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; };
document.querySelectorAll('.note textarea').forEach((t) => { grow(t); t.addEventListener('input', () => grow(t)); });

function openZoom(i, which) {
  const it = ITEMS[tab][i];
  document.getElementById('zt').textContent = it.name;
  document.getElementById('zip').src = it.photo;
  const zim = document.getElementById('zim');
  zim.onerror = () => { if (zim.src !== it.poster) zim.src = it.poster; }; // снимка 1024 нет, берём постер 320
  zim.src = it.hd || it.poster;
  document.getElementById('zfp').classList.toggle('on', which === 'photo');
  document.getElementById('zfm').classList.toggle('on', which === 'model');
  document.querySelectorAll('#zseg button').forEach((b) => b.classList.toggle('on', b.dataset.z === which));
  document.getElementById('zv').innerHTML = vbtn(it.v);
  document.getElementById('zoomer').classList.add('open');
  document.getElementById('zoomer').dataset.i = i;
}
document.getElementById('grid').addEventListener('click', (e) => {
  const b = e.target.closest('.pic'); if (b) openZoom(+b.dataset.i, b.dataset.z);
});
document.getElementById('zseg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (b) openZoom(+document.getElementById('zoomer').dataset.i, b.dataset.z);
});
document.getElementById('zx').onclick = () => document.getElementById('zoomer').classList.remove('open');
if (zoomQ) { const [w, i] = zoomQ.split(':'); openZoom(+i, w); }
</script>
</body>
</html>
