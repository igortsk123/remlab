name: CI gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    # 24.04 закреплён (29.10): ubuntu-latest переезжает на Ubuntu 26, Playwright 1.51 её не знает —
    # `playwright install --with-deps` падал, выкладка стояла с 28.10
    runs-on: ubuntu-24.04
    # Postgres+pgvector сервис — готов для integration-тестов Stage 1 (пока не используется).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: remlab
          POSTGRES_PASSWORD: test
          POSTGRES_DB: remlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U remlab" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: memory-project-audit
        # Проектный аудит памяти (Фаза 8 плана memory-bank-audit-2026-09; kit-owned memory-audit.yml
        # не трогаем): тома ADR ↔ индекс, словарь статусов планов, блокнот, canonical → _intake/,
        # секрет-файлы, md5 кита, нумерация уроков. Zero-dep — до pnpm install. Тесты инструмента
        # блокируют всегда; находки аудита — по тому же гейту, что у кита (_kit/gate-mode.txt).
        shell: bash
        run: |
          node --test tests/memory-project-audit.test.mjs
          mode="$(cat .memory_bank/_kit/gate-mode.txt 2>/dev/null || echo warn)"
          echo "gate mode: $mode"
          set +e
          node tools/memory-project-audit.mjs --check .
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::error::memory-project-audit не запустился (нет .memory_bank?)"
            exit 2
          fi
          if [ "$code" -ne 0 ] && [ "$mode" = "block" ]; then
            echo "::error::memory-project-audit нашёл проблемы, gate=block — слияние заблокировано"
            exit "$code"
          fi
          if [ "$code" -ne 0 ]; then
            echo "::warning::memory-project-audit нашёл проблемы (gate=warn — не блокирует; список выше)"
          fi
          exit 0
      - run: pnpm install --frozen-lockfile
      # ночной прогрев кадров демо: сверка кадра по состоянию И точке съёмки — предикатом самой страницы (T-20261022-16)
      - run: node tools/ops/demo-warm.mjs --selftest
      # пары RU/EN страницы демо: новая надпись без пары, кириллица в английском словаре — красный (T-20261112-116, владелец TG 1341)
      - run: node tools/ops/demo-i18n-scan.mjs --check
      # ночная досъёмка фото нейросети: потолок 200 ₽ (TG 356), трата по счётчику шлюза, прерванное — потрачено, пропуск после неудачной публикации (demo-29)
      - run: node tools/ops/demo-realistic.mjs --selftest
      # состояние CI на main для ночной сводки и людей: последний решающий прогон, красная полоса с часами, упавший шаг; API — подменой (T-20261107-41)
      - run: python3 tools/ops/ci_status.py --selftest
      # скорость фото нейросети: медленно → WARN, отказы 503 считаются, пустой журнал — «заданий 0», старый журнал без двойного счёта (T-20261107-37)
      - run: python3 tools/ops/photo-speed.py --selftest
      # сводка прода: 5xx — по журналу доступа Caddy, без двойного счёта строк журнала ошибок (T-20261106-66)
      - run: bash infra/server/prod-digest.sh --selftest
      # мёртвая рука Salad: живая группа = есть машины; pending без машин не гасим (кэш образа), без счётчиков — как раньше (T-20261106-92)
      - run: python3 infra/server/salad-deadman.py --selftest
      # выкладка только при изменении не-документов с выкатанной версии; белый список путей, сомнение → выкладка (T-20261106-66/2);
      # цель старше прода (CI закончились не по порядку) → пропуск, не откат (T-20261110-01)
      - run: bash tools/ops/deploy-need.sh --selftest
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://remlab:test@localhost:5432/remlab
      - run: pnpm build
      # 11.11: `install --with-deps` падал 3 раза из 3 с 4ccbe10f (наш код не менялся; скачивание браузера с CDN работает — проверено
      # с DEV) → системные пакеты отдельным шагом, их ошибка — аннотацией (читается без входа в GitHub); не встали — браузер без них:
      # в образе ubuntu-24.04 библиотеки Chrome уже стоят, e2e сам покажет, если чего-то нет.
      - name: Playwright — системные пакеты
        run: |
          for i in 1 2; do
            pnpm exec playwright install-deps chromium > deps.log 2>&1 && exit 0
            echo "::warning::playwright install-deps: попытка $i: $(tail -c 600 deps.log | tr '\n' ' ')"
            sleep 20
          done
          echo "::warning::playwright install-deps не прошёл — ставлю браузер без системных пакетов"
      - name: Playwright — браузер
        run: |
          for i in 1 2 3; do
            pnpm exec playwright install chromium > pw.log 2>&1 && exit 0
            echo "::warning::playwright install chromium: попытка $i: $(tail -c 600 pw.log | tr '\n' ' ')"
            sleep 30
          done
          exit 1
      # e2e/trial.spec.ts (проба агентов) поднимает второй сервер на этой же тестовой базе — ручки пробы без Postgres не работают
      - run: pnpm e2e
        env:
          TEST_DATABASE_URL: postgres://remlab:test@localhost:5432/remlab
      # реестр конвейера (tools/ops/conveyor-manifest.yml): эталон проёмов = пересборка, ручная правка — красный (T-20261112-121).
      # Здесь, а не в scout-orient: пересборке нужны node_modules (esbuild) и numpy; python ставим последним шагом — прежние шаги gate не меняются
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy && python tools/assets/opening_golden.py --check

  db-init:
    # ГАРДА ПРОД-СХЕМЫ (05.09, ADR-0179). `db/init/*.sql` — схема БОЕВОЙ базы, деплой применяет их
    # целиком на каждом выкате. 01.09 туда попали каталожные миграции (`alter table products`, а на
    # проде такой таблицы нет) — «Deploy prod» падал 4 суток, и вместе с ним молча отключился
    # smoke-тест с авто-откатом. Красный CI дешевле красного деплоя.
    # Прогон тем же скриптом, что и оба деплоя (`tools/apply-db-init.sh`) — иначе проверяли бы
    # похожий, но не тот путь, которым катится прод.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: remlab
          POSTGRES_PASSWORD: test
          POSTGRES_DB: remlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U remlab" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      PGPASSWORD: test
      PSQL_CMD: psql -h localhost -U remlab -d remlab -q -v ON_ERROR_STOP=1
    steps:
      - uses: actions/checkout@v4
      - name: Чистая БД — вся прод-схема применяется
        run: bash tools/apply-db-init.sh
      - name: Повторное применение (прод делает это на каждом деплое)
        run: bash tools/apply-db-init.sh
      - name: Таблицы, которые читает приложение, на месте
        run: |
          for t in projects generation_runs generation_steps generation_assets estimates \
                   link_clicks link_routes leads lead_messages style_results \
                   mesh_review_tasks mesh_review_decisions \
                   mesh_audit_items mesh_audit_decisions mesh_audit_batches mesh_audit_cancellations mesh_audit_marks mesh_audit_notes \
                   flat_configs trial_jobs trial_workers; do
            got=$(psql -h localhost -U remlab -d remlab -tAc "select to_regclass('public.$t')")
            [ "$got" = "$t" ] || { echo "НЕТ таблицы $t после применения db/init"; exit 1; }
          done
          echo "все обязательные таблицы на месте"

  planner:
    # Constraint-contract CI солвера (T6 truth-first, ADR-0080): совместная выполнимость
    # правил, satisfiability посадочных групп, детерминизм — ловится ДО мерджа, не на приёмке
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r services/planner-solver/requirements.txt
      - run: python -m pytest services/planner-solver/tests/ -q
      - run: python tools/scout/kitchen_fit.py --check   # реестр конвейера: посадка кухонь в git = пересборка солвером, ручная правка — красный (T-20261112-121)
      # (здесь, не в scout-orient: «образ как есть» импортирует planner — нужны shapely/pydantic из requirements выше)
      - run: python tools/scout/tests/test_draft_image_rules.py   # образ запасного рендера несёт все rules/*, которые читает его код (improve-rooms.json 07.11), COPY ↔ белый список (T-20261107-03); в раскладке образа код находит приоры практики, planner не ищет файлы вне пакета (T-20261107-07)
      - run: python -m pytest tools/ops/tests/test_disk_clean.py -q -p no:cacheprovider   # уборка диска DEV второго круга: только влитое/чистое/старое, без одобрения не удаляет, запретные пути (T-20261110-30)
      - run: python -m pytest tools/ops/tests/test_trial_e2e.py -q -p no:cacheprovider   # замерщик пробы агента: стадии, p50/p95, 429/503, без --live на прод не грузит (T-20261109-14)
      - run: python -m pytest tools/tokeny/tests -q -p no:cacheprovider   # учёт токенов (кит _optional/tokeny): цены, машины, % недели (T-20261105-19)
      - run: python tools/scout/scene_checks.py --selftest   # ворота артефактов сцены демо (demo-05 п.1)
      - run: python tools/scout/tests/test_chandelier.py   # люстра гостиной: размер по мешу, подвес укорачивается до нормы, следующая — только если не влез корпус (T-20261112-66)
      # opencv-python-headless — список товаров промпта v4 меряет тон фото (`improve_mode` → `refs_check`, cv2); без него
      # test_improve_sheet падал «No module named 'cv2'» (T-20261106-95)
      - run: pip install numpy pillow opencv-python-headless
      - run: python tools/assets/scene_extras_golden.py --check   # авто-ТВ и декор: сервер = эталон живой сцены (demo-05 п.9)
      - run: python tools/assets/tests/test_demo_ids.py   # лёгкие копии /rt/: все комнаты витрины, лента по типу комнаты, ковёр по стратегии (T-20261106-77)
      - run: python tools/assets/tests/test_floor_materials.py   # пол: доска ровно заданной ширины, шов ≤ 0,2 см без жил; CC0-сканы — тип → скан → размер → оттенок, лицензия и sha256, ≤ 1,5 МБ, цвет 512 телефону (T-20261111-24/2)
      - run: python tools/assets/tests/test_rt_texture_guard.py   # битая текстура лёгкой копии (gltfpack «ERR/» при квоте /tmp) — перепаковка без KTX2 или копию не пишем (T-20261107-15)
      - run: python tools/scout/tests/test_browser_sheet.py   # лист из кадров браузера: размер, полоса, порядок, ключ ответа (demo-10)
      - run: python tools/scout/tests/test_registry_protect.py   # реестр кадров не выкидывает кадры главной из списка прогрева (×3 вариантов, 5 ночей), счётчики shots-trim.json, _registry_add целиком; здесь — draft_service тянет planner+numpy+PIL (T-20261107-17)
      - run: python -m pytest tools/scout/tests/test_draft_trial.py -q -p no:cacheprovider   # фото тура пробы в сервисе кадров: суточный предел задания, только по кадрам 3D, фото товаров из каталога по модели, без реестра и без запасного рендера (T-20261109-34)
      - run: python tools/scout/tests/test_trial_hero.py  # AI-кадр пробы агента: плашка на картинке, отказ без оплаты при промпте «два вида», бюджет 60 с (T-20261109-13)
      - run: python tools/scout/tests/test_improve_sheet.py   # без листа товаров платного улучшения нет (422), замена товара — новый SKU в листе (T-20261106-88)
      - run: python tools/scout/tests/test_contracts_fuse.py   # шаги банка не молчат (WARN при отказе предохранителя), пара кресел — одна модель (conv-12)
      - run: python tools/scout/tests/test_refresh_digest.py   # утренняя сводка ночного прогона не уходит пустой: порванная буква WARN, сломанный вход — громко (T-20261104-11)
      - run: python tools/scout/tests/test_alert_retry.py   # alert.sh повторяет отправку в TG (обрывы связи), 4xx без повтора, длинное — частями, токен не в журналах (урок 551, T-20261105-31)
      - run: python tools/scout/tests/test_demo_soft.py   # (нужен planner: draft_render) мягкое (подушки, шторы, плед) — в списке и в «Улучшить фото», не в 3D и без мешей (demo-24)
      - run: python -m pytest tools/scout/tests/test_wall_art.py -q -p no:cacheprovider   # картины над мебелью: подбор 1–2 по доле ширины опоры и потолку, декор и ленты, обрезка белого поля, вазы на столике не снимаются (T-20261112-26)
      - run: python tools/scout/tests/test_demo_bedroom.py   # (солвер спальни — shapely из planner) спальни витрины: банк → варианты с комнатой, флаг только у сборки рядом, ленты (onb-07)
      - run: python tools/scout/bed_headboard.py --selftest && python tools/scout/tests/test_bed_headboard.py   # кровать боком: изголовье по геометрии в каскаде (доворот / блок orientation_mismatch), сторож решений, одна проба на размер и низкие рамы под окном (T-20261110-20/3)
      - run: python -m pytest tools/scout/tests/test_trial_bundle.py -q -p no:cacheprovider   # проба агента: данные страницы /demo под загруженный план — пустые комнаты, сцена, отказы; образец для контракта TS (T-20261109-21)
      - run: python -m pytest tools/scout/tests/test_rules_one.py -q -p no:cacheprovider   # один набор правил для /demo и загруженного плана: подкраска/разворот/подвесная/плоскость/семья цветов, предмет решателя спальни, предпроверка тура не строже движка на flat215 и планах из объявлений (T-20261112-96, TG 940/942)
      - run: python -m pytest tests/floorplan/test_room_edits.py -q -p no:cacheprovider   # правка комнаты агентом в туре: поиск комнаты (id или центр), масштаб от центра, исходник в plan, канон цел (T-20261110-36)
      - run: python -m pytest tests/floorplan/test_area_labels.py -q -p no:cacheprovider   # площадь по подписи листа: показ подписи, сверка с контуром, масштаб по подписям; правка агента тянет показанную площадь и контур тем же sx·sy, флаги сверки на месте (T-20261111-12, T-20261112-28)
      - run: python -m pytest tests/floorplan/test_opening_edits.py -q -p no:cacheprovider   # окна и двери агента на плане: снять/сдвинуть/добавить, поиск после перечитывания, комнаты по обе стороны стены, дверь даёт вход (T-20261110-39)
      - run: python tools/scout/tests/test_room_distinct.py   # две комнаты одного типа и стиля — разные товары: лучший без повтора, пара тумб — пара, пул исчерпан — dup (WARN demo_room_dup), порядок — реестр (bedroom-distinct-01, T-20261107-32)
      - run: python tools/scout/tests/test_demo_room_golden.py && python tools/scout/tests/test_demo_room.py   # общее ядро витрины комнаты: спальня побайтно по эталону до переноса (33 сценария); прихожая — контур, зеркало на стене (elev), ведущие ANY/ALL и пары из профиля, зеркало без модели в ленте (hall-demo-01 этап 3, T-20261106-98)
      - run: python tools/scout/tests/test_demo_room_build.py   # сборка витрины комнат по записи (без базы): данные спальни побайтно с main до этапа 4 (эталон в CI), «спальни выкл» / «только прихожая»; прихожая — 5 вариантов, HARD 0, метка «нет модели», отказ HALL_MESH_GATE=0 у папки витрины (hall-demo-01 этап 4, T-20261107-05)
      - run: python tools/scout/room_candidate.py --selftest && python tools/scout/compose_hall.py --selftest && python tools/scout/room_coverage.py --selftest && python tools/scout/tests/test_compose_atomic.py   # сборщики спальни и прихожей: кандидат — после проверки и атомарно, отказ — код 1 и прежний цел; прихожая — id от ячейки и матрица; правило ядра спальни — стиль без ядра пропущен (WARN), стиль живого банка — FAIL (room-bank-nightly-04, T-20261106-89)
      - run: python tools/scout/tests/test_style_color.py   # цвет по стилю и роли: изумрудная кровать минимализма — не кандидат, ярус цвета раньше меша (спальня, прихожая), квота мешей не считает forbidden (style-color-01, T-20261107-12)
      - run: python tools/scout/tests/test_living_color.py   # цвет в гостиной: стеллаж «Кейн серо-зелёный» минимализма не берётся и в витрине заменяется, «Марти-2 олива» джапанди ниже графитового (пара — одной заменой), 4 остальных варианта по цвету не меняются, лента — forbidden снимает стиль, discouraged в конец (style-color-01 шаг 2а, T-20261107-25/2)
      - run: python tools/scout/tests/test_demo_en_roles.py   # EN-страница витрины: роли спальни и прихожей переведены (по профилям комнат, T-20261106-77 Д6)
      - run: python tools/scout/tests/test_names_en.py   # английские названия товаров: 0 кириллицы, обычное слово — словарём, не транслитом; ручной перевод с транслитом знакомого слова не берётся (T-20261112-116, TG 1337/1341)
      - run: pip install scipy && python tools/scout/tests/test_demo_swatch.py   # кружок цвета — тон ткани без фона и теней, светлое не серит (demo-28)
      - run: python tools/scout/tests/test_style_fallback.py   # комната без выбранного стиля — молча похожий вариант: карта замен (соседи → палитра → вкладки), неоклассика только в гостиной (style-fallback-01, T-20261107-23)
      - run: pip install trimesh && python tools/scout/tests/test_wall_plane.py   # (trimesh — scene_mesh → mesh_render; в planner его нет) (нужен planner: draft_render) зеркало прихожей на серверном кадре — плоскость на стене по стене/развороту/высоте солвера, не clay и не меш, закрывается мебелью (T-20261106-73)

  draft-image:
    # Образ сервиса кадров собирается ИЗ РЕПОЗИТОРИЯ (b2b-08, ADR-0267): сборка проверяет импорты HTTP-рендера —
    # файл, которого нет в git (как styles.json до 13.10), ловится здесь, а не при пересоздании контейнера на проде.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: DOCKER_BUILDKIT=1 docker build -f infra/draft/Dockerfile --build-arg DRAFT_VERSION=ci -t remlab-draft:ci .
      - name: Сервис кадров отвечает на /health
        run: |
          set -x
          docker images remlab-draft
          cid=$(docker run -d -e DRAFT_PORT=8099 remlab-draft:ci) || exit 1
          for i in $(seq 1 30); do
            if docker exec "$cid" python -c "import urllib.request;print(urllib.request.urlopen('http://127.0.0.1:8099/health',timeout=3).read().decode())"; then exit 0; fi
            sleep 2
          done
          docker logs "$cid"; exit 1

  scout-orient:
    # Контракт ориентаций мешей (ADR-0129/0131): процедурная фикстура, знаки замером —
    # регресс конвенции ловится до мерджа, а не на кривой сцене.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy trimesh pillow
      - run: python tools/scout/orient_selftest.py
      - run: python tools/scout/orient_policy.py --selftest   # разворот: публикуются только решённые, cabinet_* не «уверенный» в серверном кадре (T-20261105-56)
      - run: python tools/scout/tests/test_orient_role_policy.py   # перерешение при смене роли в обе стороны, человек не перерешается, роль каталога главнее mesh_demand, тень без записи в БД (T-20261105-56/5)
      - run: python tools/scout/opening_ir.py --selftest   # проёмы кадра из общего описания (demo-04)
      - run: python tools/scout/mesh_dark.py --selftest    # модель темнее товара — признак карантина (demo-05)
      - run: python tools/scout/mesh_color_check.py --selftest   # сторож «меш не того цвета»: видимый цвет (модель × подкраска сцены) против фото, порог p99 из правил, вердикт про этот ассет (T-20261107-14/2)
      - run: pip install shapely && python tools/scout/tests/test_family_colour_feed.py   # (shapely — trial_demo → trial_room; в scout-orient его нет, CI красный с 2cd4032b) вариант семьи на чужой модели другого цвета не идёт в «Заменить» /demo и тура: подкраска от модели, строгий порог, отметка без замера, свой меш в спрос («Латте» зелёная, T-20261112-89)
      - run: pip install scipy && python tools/scout/salad/tests_alien_debris.py   # пометка обломков меша: GLB (Scene) и Trimesh судятся без ошибки, ALIEN_CUT=0 файл не трогает (T-20261106-85/3; scipy — trimesh.split делит меш на тела через него, в образе воркера он есть)
      - run: pip install fast-simplification && python tools/scout/tests/test_mesh_lite.py   # эскиз меша: LITE_TEXTURE_SAFE — текстурный меш, который не ужать с границей, полным (T-20261105-51/2)
      - run: python tools/scout/unfit.py --selftest        # пригодность для гостиной: одно правило у подбора и лечения демо
      - run: python tools/scout/env_keys.py --selftest     # ключи и журнал расходов из worktree — основной копии, чужой mltest последним с WARN (T-20261105-52)
      - run: python tools/scout/catalog_items.py --selftest   # адаптер каталога комнат: неизвестный тип/роль — ошибка, товар в двух ролях, схема (T-20261105-39)
      - run: python tools/scout/catalog_items_shadow.py --selftest   # тень гостиной: запрос берётся из compose2.py, устаревшая тень — отказ (T-20261105-39)
      - run: python tools/scout/room_profile.py --selftest && python tools/scout/room_profile.py --lint   # профили комнат: схема, версия, ссылки, плагины, роли = адаптер, виды = CAM_ZONES демо (T-20261105-40)
      - run: python tools/scout/asset_coverage.py --selftest   # аудит покрытия мешей: статус товара (привязан/сирота/брак), вариант семьи, корзины, банк (T-20261105-42)
      - run: python tools/scout/room_mesh_demand.py --selftest && python tools/scout/room_mesh_jobs.py --selftest   # спрос мешей комнат: общий остаток ≤ 500 ₽ на все комнаты и запуски (два запуска подряд), спрос по вариантам витрины (T-20261106-75)
      - run: python tools/scout/tests/test_front_roles.py   # перед меша — свойство роли в данных (front в asset-strategies.json): гостиная и спальня как были, прихожая направленная, резерв спроса тот же (T-20261106-78)
      - run: python tools/scout/room_bindings.py --selftest   # привязка товар→меш комнат: готовность (фото, поколение, sha, ориентация, паспорт), семья ссылкой, снимок и таблица (T-20261105-45)
      - run: python tools/scout/tests_scene_dims.py   # глубина «для сцены» у стульев К2: солвер и предметы демо — по мешу, подпись — каталог, банк не тронут, откат флагом (T-20261107-25/9)
      - run: python tools/scout/room_publish.py --selftest && python tools/scout/mesh_publish.py --selftest   # публикация мешей комнат: файл привязки с проверкой sha, представитель один раз, без настройки — гостиная как прежде (T-20261105-47)
      - run: python tools/scout/hall_catalog.py --selftest   # каталог прихожей: роли на 142 названиях (пуф/скамья — банкетка только по форме, без размеров — нет, T-20261107-18), размеры зеркал; комплект из модулей — только фото, не в меши (T-20261106-71)
      - run: python tools/scout/room_mesh_demand.py --selftest   # спрос на меши комнат по слотам: ячейки стиль×роль×слот, покрытие по семействам, сначала банк, потолок денег (T-20261105-49)
      - run: python tools/scout/gallery_binding_shadow.py --selftest   # тень «галерея по привязке»: повтор правила mtime, классы расхождений (T-20261105-50)
      - run: python tools/scout/salad/gallery_build.py --selftest   # галерея: выбор файла «привязка, иначе mtime» за флагом GALLERY_FROM_BINDING (выкл/вкл/нет файла привязки), glb_sha (T-20261105-50/2)
      - run: python tools/scout/tests/test_parity_prune.py   # уборка стенда паритета: последние keep_runs прогонов + прогоны свежих эталонов; data-*, эталоны и жёсткие ссылки целы (T-20261107-48/2)
      - run: python tools/scout/tests/test_parity_living.py   # стенд паритета гостиной: шум, подмешанное различие, устаревший эталон, сторож записи и сети (T-20261105-41)
      - run: python tools/ops/merge_queue.py --selftest   # сборщик веток в тени: виновная делением пополам, конфликт не валит остальных, мигание не вешается, main красный — отдельно, ветка@sha (T-20261112-78)
      - run: bash tools/ops/heavy-slot-selftest.sh   # общая очередь тяжёлых прогонов DEV: по одному, смерть держателя освобождает, порог памяти, rc, таймаут, вложенный (T-20261105-57)
      - run: bash tools/ops/tour-reissue-selftest.sh   # автоперевыпуск туров после выкладки демо: счётчики, отказ не молча, «демо = туры» (витрина и правила), день — тревога, ночь — DIGEST:!, три выкладки подряд = два прохода (T-20261112-92)
      - run: node tools/scout/precompress.mjs --selftest   # заранее сжатые копии витрины: .br/.gz распаковываются в исходник, пересжатие по времени исходника, сироты и мелкое — прочь, img/topsprites не трогаем (T-20261110-43/2)
      - run: python tools/scout/atomic_io.py --selftest && python tools/scout/tests/test_publish_demo.py   #выходные json сборки демо — подменой; публикация: копия прежней версии, хранится 3, откат переносом без подмены каталога, проба на /test/ (T-20261105-59)
      - run: python tools/scout/tests/test_no_hard_tmp.py   # ночной путь демо без жёсткого /tmp: временное в REMLAB_TMP, TMPDIR в refresh_daily, demo_rt убирает свой файл (T-20261107-02)
      - run: python tools/scout/tests/test_tmp_hygiene.py   # временное тестов и селфтестов — через remlab_tmp (REMLAB_TMP → ~/remlab-scratch/tmp, в CI системная) и с уборкой; shell-помощник, heavy_slot TMPDIR, tmp-sweep rt-* (T-20261107-13)
      - run: python tools/scout/tests/test_img_fallback.py   # фото не скачалось → копия опубликованной главной (только 200 + картинка), иначе плашка «нет фото» без запроса …/null (T-20261106-65)
      - run: python tools/scout/tests/test_improve_prompt.py   # промпт «реалистично» v2: фото-вид, каталожная форма, тёплые гайды (demo-11)
      - run: python tools/scout/tests/test_rug_kids.py   # детские ковры: слова только для текстиля, ответ VLM по форме, роль по кэшу (demo-05)
      - run: python tools/scout/tests/test_kids_textile.py   # словарь детского текстиля — только ковры и текстиль, общий KIDS — все роли (T-20261017-01)
      - run: python tools/scout/tests/test_home_rooms.py   # главная «стиль → комнаты»: комнаты из реестра, id стиля для ?style= (demo-16)
      - run: python tools/scout/tests/test_bench_nook.py   # «уголок» с банкеткой — только при ≥ 2 банкеток в ленте стиля, иначе стулья (demo-19 Г2)
      - run: python tools/scout/tests/test_demo_hidden.py   # скрытый банком сет (bank_status hidden) — не вариант демо и не источник ленты замен (conv-14)
      - run: python tools/ops/disk-keeper.py --selftest   # сторож места DEV: только белый список rules/dev-disk.json, старше недели, не то, что называет код; хранилище мешей, ссылки, живые журналы — нет; сухой режим по умолчанию (T-20261107-48)
      - run: python tools/scout/tests/test_demo_cams_timeout.py   # ракурсы окна не валят сборку: таймаут demo-cams — WARN:demo_cams, сборка идёт дальше, exec node (T-20261107-47)
      - run: python tools/scout/tests/test_demo_own_spare.py   # ушла роль ядра — сперва свой запасной набора; не расставился — тот же набор из пула (T-20261023-10)
      - run: python tools/scout/tests/test_typical_dims.py   # напольные роли солвера — один список в git, с ковром; без файла — отказ (T-20261023-10)
      - run: python tools/scout/tests/test_dims_gabarit.py   # глубина диванов/кресел divan.ru из «Глубина габаритная»; у других магазинов разбор тот же (conv-14)
      - run: python tools/scout/tests/test_drawing_dims.py   # глубина с чертежа: строгий разбор ответа модели, выбор d кодом и гейты, сухо без вызовов (conv-15)
      - run: python tools/scout/tests/test_mesh_bind_args.py   # mesh_bind: неизвестный ключ (--selftest…) — отказ rc 2 до базы (T-20261023-10)
      - run: python tools/scout/tests/test_room_scores.py   # оценки стиля комнат не смешиваются: выборка близнецов — только своя комната room_catalog (T-20261105-34/2)
      - run: python tools/scout/tests/test_style_calib.py   # поправка балла стиля по признакам фида: правила, текстиль не судим по металлу, метка версии, включён вариант А (T-20261112-119)

  scout-selftest:
    # Селфтесты загрузки каталога (план catalog-load-hardening П0.4): правила разбора фида, единиц
    # размеров, реф-ссылок, наличия и свежести закреплены таблицами случаев; данные вне git
    # подменяются мини-фикстурами из tools/scout/tests/fixtures. Плюс сверка двух копий модуля
    # стратегий ассетов — их расхождение уже глушило предикат готовности мешей (03.09).
    runs-on: ubuntu-latest
    env:
      SCOUT_PRIORS_PATH: tools/scout/tests/fixtures/unit-priors-mini.json
      SCOUT_ROLES_PATH: tools/scout/tests/fixtures/category-roles-mini.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pillow — room_identity --selftest берёт состав спальни из compose_bedroom → compose_common (цвет товара по фото, PIL);
      # без него цикл падал «No module named 'PIL'» (T-20261106-95)
      - run: pip install pillow
      - run: |
          for m in dim_resolver reflink stock_truth feed_guard load3 category_map page_alive stock_check footprint dim_audit dim_prior render_strategy salad/ingest_registry salad/prune_shapes salad/pool_ledger mesh_priority mesh_family tests_chain draft_guard draft_jobs demo_fill price_truth style_axes style_bench slot_rules pipeline_map salad/wave_guard mesh_quarantine bed_dims room_catalog upholstery orient_review heal_policy demo_swap_pool demo_band sofa_shape pool_gate photo_hash bank_paths compose_gates mesh_publish enrich set_identity bank_invariants bank_pending bank_ready mesh_decisions mesh_audit_sync mesh_audit_posters bank_run bank_prepare bank_keep bank_promote tests_compose_dining bank_refresh room_bank_spec room_identity room_ready tests_refresh_order dimless sets_incremental db_migrate; do
            echo "== $m --selftest"; python tools/scout/$m.py --selftest || exit 1
          done
      - run: python tools/scout/tests/test_bank_spec_golden.py   # банк гостиной через RoomBankSpec: вывод и файлы всех bank_* побайтно как до этапа Б (room-bank-01, T-20261106-67)
      - run: python tools/scout/tests/test_room_bank_flags.py   # флаги write_enabled гостиной и спальни раздельно (4 сочетания), BANK_WRITE — только гостиная, каркас (прихожая) не пишет, чужой manifest — отказ (T-20261106-67; этап Ж — спальня настоящая)
      - run: python tools/scout/tests/test_room_bootstrap.py   # банк спальни: поколение 0 только со словом ведущего и флагом, повтор и откат, сбой в каждом окне, готовность из привязки (room-bank-01 этап В, T-20261106-70)
      - run: python tools/scout/tests/test_bank_state.py   # состояние живого банка комнаты (живой = журнал, намерения нет) — ворота публикации демо ночью (room-bank-01 этап Д, T-20261107-04)
      # экзамен ячейки в test_room_guards ставит набор солвером (`planner.models` → pydantic, shapely) — пакеты солвера здесь (T-20261106-95)
      - run: pip install -r services/planner-solver/requirements.txt
      - run: python tools/scout/tests/test_room_guards.py   # сторожа кандидата банка спальни и прихожей: strict по каталогу, готовность моделей, экзамен ячейки, демо old/hybrid, доля ≤ 25 % целыми ячейками, строка DIGEST (room-bank-01 этап Г, T-20261106-93)
      - run: python tools/scout/tests/test_bank_rehearsal.py   # тень банка комнаты: писатель спальни по ключу ячейки (60 записей → 60 id, повтор — те же), запись в копию → откат по SHA, живой и поколения не тронуты, внешних записей 0 (room-bank-01 этап Е, T-20261107-04)
      - run: python tools/scout/tests/test_room_bank_chain.py   # настоящие шаги спальни: prepare (паспорт, проверки) → promote (manifest, новые в хвост, retired) → писатель add → откат по SHA, hold; витрина без retired (room-bank-01 этап Ж, T-20261107-04/3)
      - run: python tools/scout/salad/tests_sink_gate.py   # ворота приёмника и чистка — одна мера с зазором, счётчик = диск (mesh-12)
      - run: python tools/scout/salad/tests_topview_step.py   # шаг топ-вью: проход под таймаутом, дедлайн в /bin/sh, таймаут = сбой (T-20261020-15)
      - run: python tools/scout/salad/salad_groups.py --selftest && python tools/scout/salad/tests_batch_window.py   # группы Salad: удалённая (deleted) не отдаётся расписанию и не поднимается, сверка правила ↔ Salad без сети; расписание: 404 на стопе — «гасить нечего», 404 на старте — тревога (T-20261106-86)
      - run: python tools/scout/salad/tests_money_guard.py   # сторож денег: смена SALAD_GROUP посреди цикла, слепота, причина остановки — по фактам (T-20261020-24); потолок цены меша — гасит одну дорогую группу (mesh-15)
      - run: python tools/scout/salad/tests_pool.py   # пул нод без Salad; курсор при 75 и `<снимок>.done` — без повторов (план mesh-13)
        env:
          SALAD_GROUP: g
          SALAD_API_KEY: x
      - run: python tools/scout/salad/tests_queue.py   # транспорт «очередь Salad» без сети: обёртка запуска (sha, два процесса, стоп), посредник (машина в ответе), сборщик (итог по ответу воркера, без двойной постановки), общий прогон SSH+очередь, мёртвый прогрев, disabled — mesh-18
        env:
          SALAD_GROUP: g
          SALAD_API_KEY: x
      - run: python tools/scout/salad/queue_run.py --selftest
      - run: bash tools/ops/cron-pause.sh selftest   # пауза кронов на обслуживание: на паузе тяжёлые кроны выходят строкой в лог, on ждёт работающих (onb-12)
      - run: pip install pyyaml && python tools/hooks/guard_conveyor_test.py   # хук Claude PreToolUse по реестру конвейера: правка собранного файла и обход --force — отказ, ложных нет (T-20261112-121 шаг 3)
      - run: pip install pyyaml && python tools/ops/conveyor_check.py && python tools/ops/conveyor_check.py --selftest   # реестр конвейера: собранный файл правят только генератором — печать/пересборка, неизвестный писатель, устаревший реестр → красный; prepush гоняет всегда (T-20261112-121, TG 1366/1381)
      - run: pip install pyyaml && python tools/ops/prepush_check.py --selftest   # перед пушем — проверки CI по изменённым файлам: карта из ci.yml (цикл, &&, pip срезан), «тест читает файл», потолок времени; правка refresh_daily.sh / rules/demo-realistic.json запускает demo-realistic (T-20261107-41)
      - run: python tools/scout/tests_bank_isolation.py   # новый банк рядом: копия не пишет sets3.json и общие файлы, ворота сборщика fail-closed (план conv-13)
      - run: diff -q tools/scout/asset_strategy.py tools/scout/salad/asset_strategy.py
      - run: diff -q tools/scout/rules/asset-strategies.json tools/scout/salad/asset-strategies.json
