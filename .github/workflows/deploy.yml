name: Deploy prod

# Инкрементальный авто-деплой (по умолчанию): после зелёного «CI gate» на main.
# Сборка arm64 идёт в GitHub-раннере с кэшем слоёв (быстрая пересборка) и пушится в GHCR;
# сервер делает `docker compose pull` — тянет ТОЛЬКО изменённые слои (легко), у себя НЕ собирает.
# VPN-нода не затрагивается. Нужен только секрет DEPLOY_SSH_KEY (без него — пропуск). Хост — публичный IP.
on:
  workflow_run:
    workflows: ["CI gate"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  DEPLOY_HOST: "89.167.127.0"
  IMAGE: ghcr.io/${{ github.repository_owner }}/remlab-app
  # Выкатываем РОВНО тот коммит, который прошёл CI. Для события `workflow_run` `github.sha` — это
  # HEAD ветки по умолчанию на момент запуска, а не SHA проверенного прогона: пока чинился деплой,
  # успевал прилететь следующий пуш, и на сервер уехал бы непроверенный коммит (находка Codex 05.09).
  TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    # Нативный arm64-раннер (repo PUBLIC → бесплатно): собираем БЕЗ QEMU-эмуляции.
    # Эмуляция arm64 крашила Next-SWC-воркер (qemu SIGILL). Нативная сборка стабильна и быстра.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Проверка секрета
        id: gate
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEPLOY_SSH_KEY не задан — деплой пропущен."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.gate.outputs.ready == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка+push (arm64, кэш слоёв)
        if: steps.gate.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: APP_VERSION=${{ env.TARGET_SHA }}
          tags: ${{ env.IMAGE }}:latest,${{ env.IMAGE }}:${{ env.TARGET_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH setup
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ env.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Синхронизация файлов сервера (db/init — с удалением лишнего)
        if: steps.gate.outputs.ready == 'true'
        env:
          SRV: root@${{ env.DEPLOY_HOST }}
        run: |
          command -v rsync >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq rsync; }
          ssh "$SRV" "mkdir -p /opt/remlab/db/init /opt/remlab/scripts"
          scp docker-compose.yml "$SRV:/opt/remlab/docker-compose.yml"
          # `--delete` ОБЯЗАТЕЛЕН, не `scp` (05.09): каталог примонтирован в контейнер БД и
          # применяется глобом целиком, поэтому файл, удалённый из репозитория, продолжал жить на
          # сервере и ронять деплой. Так каталожные миграции 008/009 роняли выкат 4 суток.
          rsync -az --delete --include='*.sql' --exclude='*' db/init/ "$SRV:/opt/remlab/db/init/"
          scp tools/apply-db-init.sh infra/server/deploy-remote.sh "$SRV:/opt/remlab/scripts/"
          ssh "$SRV" "chmod +x /opt/remlab/scripts/apply-db-init.sh /opt/remlab/scripts/deploy-remote.sh"

      - name: "Деплой на сервер (под замком: миграции ДО активации)"
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        env:
          SRV: root@${{ env.DEPLOY_HOST }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Место нужно ДО pull (04.09): CI оставлял тег на каждый push, 135 × 308 МБ забили диск,
          # приёмник мешей ушёл в 507. cleanup.sh scoped и берёт замок /opt/remlab/.deploy.lock сам,
          # поэтому вызывается ДО критической секции, а не внутри неё.
          ssh "$SRV" "[ -x /opt/remlab/scripts/cleanup.sh ] && /opt/remlab/scripts/cleanup.sh || true"
          ssh "$SRV" "echo '$GHCR_TOKEN' | docker login ghcr.io -u '$ACTOR' --password-stdin"
          # Весь выкат — под тем же замком: сторож диска не должен снимать теги между pull и up.
          ssh "$SRV" "flock -w 900 /opt/remlab/.deploy.lock \
            env REMLAB_IMAGE='${IMAGE}:${TARGET_SHA}' APP_VERSION='${TARGET_SHA}' \
            /opt/remlab/scripts/deploy-remote.sh"

      - name: Выход из GHCR
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' }}
        run: ssh "root@${{ env.DEPLOY_HOST }}" "docker logout ghcr.io" || true

      # Страховка выполняется и после провала предыдущего шага: с 01.09 деплой падал на миграциях,
      # GitHub пропускал этот шаг целиком — прод оставался непроверенным, а авто-откат был выключен
      # молча. `!cancelled()` (а не `always()`) — чтобы отмена прогона не запускала откат.
      # Проверяем ИМЕННО целевую версию: одного кода 200 мало — при провале выката сайт отвечает
      # 200 на старой (или уже подменённой) версии, и smoke «подтверждал» бы чужой успех.
      - name: Smoke целевой версии + откат при провале
        if: ${{ !cancelled() && steps.gate.outputs.ready == 'true' }}
        env:
          SRV: root@${{ env.DEPLOY_HOST }}
        run: |
          want="$TARGET_SHA"
          code=000; ver=""; ok=""
          for i in $(seq 1 20); do
            resp=$(curl -s -w '\n%{http_code}' --max-time 8 https://remont-lab.online/api/health || true)
            code=$(printf '%s' "$resp" | tail -n1)
            body=$(printf '%s' "$resp" | sed '$d')
            # Разбор без jq намеренно: отсутствие утилиты дало бы пустую версию, smoke счёл бы
            # исправный выкат провалом и откатил бы прод.
            ver=$(printf '%s' "$body" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p')
            ok=$(printf '%s' "$body" | grep -q '"ok":true' && echo true || echo false)
            if [ "$code" = "200" ] && [ "$ok" = "true" ] && [ "$ver" = "$want" ]; then
              echo "OK: health 200, ok=true, version=$want"
              # после успешного smoke снимаем теги прошлых деплоев (образ prev остаётся)
              ssh "$SRV" "[ -x /opt/remlab/scripts/cleanup.sh ] && /opt/remlab/scripts/cleanup.sh || true"
              exit 0
            fi
            echo "ждём... ($i) code=$code version=${ver:0:12} ok=$ok"; sleep 6
          done
          if [ "$code" = "200" ]; then
            # Сайт жив, но на другой версии: выкат не состоялся. Откатывать нечего — откат здесь
            # только сменил бы живую версию на ещё более старую.
            echo "САЙТ ЖИВ на версии ${ver:0:12}, целевая ${want:0:12} не активирована — откат НЕ нужен, нужен разбор."
            exit 1
          fi
          echo "САЙТ НЕ ОТВЕЧАЕТ (code=$code) -> откат на remlab-app:prev"
          ssh "$SRV" "cd /opt/remlab && flock -w 300 /opt/remlab/.deploy.lock \
            env REMLAB_IMAGE=remlab-app:prev APP_VERSION=prev docker compose up -d \
            && echo 'откат выполнен' || echo 'откат не удался — ручной разбор'"
          exit 1
